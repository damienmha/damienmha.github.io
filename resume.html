<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Damien Ha - Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Damien Ha</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="resume.html">Resume</a>
        <a href="contact.html">Contact</a>
      </nav>
      <button id="theme-toggle" class="theme-toggle">🌙</button>
  </header>

  <main>
    <h2>My Resume</h2>

    <p>Here’s my most recent resume below.</p>
    
    <div class="pdf-container">
      <embed src="Damien_Ha_Resume.pdf" type="application/pdf" />
    </div>
  
    <p class="resume-download">
      If the embedded version doesn’t load properly on your device,
      you can <a href="Damien_Ha_Resume.pdf" download class="download-btn">Download the PDF here</a>.
    </p>
  </main>

  <footer>
    <p>© 2025 Damien Ha</p>
  </footer>
  <script>
    // Apply user preference on load, fallback to system preference
    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
    }
  
    // Load saved theme or system preference
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme) {
      applyTheme(savedTheme);
    } else {
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      applyTheme(prefersDark ? "dark" : "light");
    }
  
    // Toggle button logic
    const toggleBtn = document.getElementById("theme-toggle");
    toggleBtn.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme");
      const newTheme = current === "dark" ? "light" : "dark";
      applyTheme(newTheme);
      localStorage.setItem("theme", newTheme);
  
      toggleBtn.textContent = newTheme === "dark" ? "☀️" : "🌙";
    });
  </script>  
</body>
</html>
